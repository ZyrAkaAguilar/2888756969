<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Lobby Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-1: #0b0524;
            --bg-2: #1b0a4a;
            --card-bg: #140c36;
            --accent-primary: #ffbe0b;
            --accent-pink: #ff006e;
            --accent-cyan: #00f5d4;
            --accent-lime: #38b000;
            --text-main: #ffffff;
            --hard-shadow: 0 8px 0 rgba(0, 0, 0, 0.55);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 30%, var(--bg-2) 0%, var(--bg-1) 100%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* =========================================
           FONDO CINÉTICO ESTILO JACKBOX
           ========================================= */
        .bg-rays {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 220vmax;
            height: 220vmax;
            transform: translate(-50%, -50%);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(255, 255, 255, 0.025) 0deg 10deg,
                transparent 10deg 20deg
            );
            animation: spinRays 70s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes spinRays {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .bg-dots {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        .floating-shapes {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .shape {
            position: absolute;
            bottom: -80px;
            opacity: 0.16;
            font-size: 2rem;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% { opacity: 0.2; }
            85% { opacity: 0.2; }
            100% {
                transform: translateY(-115vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* =========================================
           CONTENEDOR PRINCIPAL TV
           ========================================= */
        .stage-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1680px;
            margin: 0 auto;
            padding: 26px 40px 85px 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            flex: 1;
        }

        .shake-active {
            animation: screenShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-3px, 2px, 0); }
            20%, 80% { transform: translate3d(5px, -3px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 3px, 0); }
            40%, 60% { transform: translate3d(6px, -2px, 0); }
        }

        /* =========================================
           HEADER SUPERIOR DEL EVENTO
           ========================================= */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .location-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.45);
            border: 3px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: var(--hard-shadow);
        }

        .live-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: pulseDot 1.4s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.45); opacity: 0.5; }
        }

        .event-brand {
            text-align: center;
            flex: 1;
        }

        .event-title {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(1.8rem, 3.2vw, 3rem);
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 5px 0 rgba(0, 0, 0, 0.65);
            animation: gentleBob 4s ease-in-out infinite;
        }

        .event-subtitle {
            display: inline-block;
            margin-top: 4px;
            background: var(--accent-pink);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transform: rotate(-1.5deg);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
        }

        @keyframes gentleBob {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .clock-pill {
            background: rgba(0, 0, 0, 0.45);
            border: 3px solid rgba(255, 255, 255, 0.15);
            padding: 10px 22px;
            border-radius: 999px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent-primary);
            box-shadow: var(--hard-shadow);
        }

        /* =========================================
           ESCENARIO CENTRAL: ACTIVIDAD ACTUAL
           ========================================= */
        .activity-stage {
            position: relative;
            background: linear-gradient(135deg, #1d114d 0%, #120933 100%);
            border: 4px solid var(--accent-primary);
            border-radius: 24px;
            padding: 32px 44px;
            text-align: center;
            box-shadow: 0 12px 0 rgba(0, 0, 0, 0.65), 0 0 50px rgba(255, 190, 11, 0.18);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .activity-stage.slam-anim {
            animation: stageSlam 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes stageSlam {
            0% { transform: scale(0.84) rotate(-1.5deg); opacity: 0.4; }
            60% { transform: scale(1.03) rotate(0.8deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); }
        }

        .activity-badge {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%) rotate(-1deg);
            background: var(--accent-primary);
            color: #0b0524;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 22px;
            border-radius: 999px;
            border: 3px solid #0b0524;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .activity-title {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(2.4rem, 5vw, 4.6rem);
            font-weight: 700;
            margin: 8px 0 10px 0;
            line-height: 1.05;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 6px 0 rgba(0, 0, 0, 0.7);
        }

        .activity-desc {
            font-size: clamp(1.05rem, 1.8vw, 1.45rem);
            font-weight: 600;
            color: #d6ceff;
            max-width: 950px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* =========================================
           SECCIÓN DE INVITADOS (LOBBY WALL)
           ========================================= */
        .guests-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .guests-heading {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.7rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
        }

        .counters-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .counter-chip {
            padding: 7px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
        }

        .counter-chip.present { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .counter-chip.coming { border-color: var(--accent-primary); color: var(--accent-primary); }
        .counter-chip.missing { border-color: #7b72a8; color: #b5addb; }

        .guests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .guest-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 4px solid var(--guest-color, #00f5d4);
            box-shadow: 0 9px 0 rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
        }

        /* Invitado que YA LLEGÓ (Presente) */
        .guest-card.status-presente {
            animation: cardFloat 3.6s ease-in-out infinite;
            animation-delay: var(--float-delay, 0s);
        }

        .guest-card.just-arrived {
            animation: elasticPop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(1deg); }
        }

        @keyframes elasticPop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.12) rotate(3deg); opacity: 1; }
            80% { transform: scale(0.96) rotate(-1deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Invitado EN CAMINO */
        .guest-card.status-en_camino {
            border-style: solid;
            border-color: #ffbe0b;
            background: linear-gradient(180deg, rgba(255, 190, 11, 0.12) 0%, #140c36 100%);
            animation: pulseComing 2.2s infinite ease-in-out;
        }

        @keyframes pulseComing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Invitado PENDIENTE / AUSENTE */
        .guest-card.status-pendiente,
        .guest-card.status-ausente {
            border: 3px dashed rgba(255, 255, 255, 0.22);
            background: rgba(15, 10, 38, 0.55);
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
            opacity: 0.62;
            filter: grayscale(0.65);
        }

        .guest-status-pill {
            position: absolute;
            top: -13px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 2px solid #0b0524;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5);
        }

        .status-presente .guest-status-pill {
            background: var(--guest-color, #00f5d4);
            color: #0b0524;
        }

        .status-en_camino .guest-status-pill {
            background: #ffbe0b;
            color: #0b0524;
        }

        .status-pendiente .guest-status-pill,
        .status-ausente .guest-status-pill {
            background: #2c2454;
            color: #cfc8f0;
        }

        .guest-avatar {
            width: 78px;
            height: 78px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            margin: 8px 0 12px 0;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .guest-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .guest-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: #ffffff;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.6);
        }

        .guest-role {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--guest-color, #00f5d4);
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .status-pendiente .guest-role,
        .status-ausente .guest-role {
            color: #9e96c7;
        }

        /* =========================================
           CINTILLO INFERIOR (TICKER EN VIVO)
           ========================================= */
        .ticker-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 54px;
            background: #09041c;
            border-top: 4px solid var(--accent-pink);
            display: flex;
            align-items: center;
            overflow: hidden;
            z-index: 50;
            box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.65);
        }

        .ticker-label {
            background: var(--accent-pink);
            color: #fff;
            font-weight: 900;
            font-size: 0.88rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 22px;
            height: 100%;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            z-index: 2;
            box-shadow: 6px 0 15px rgba(0, 0, 0, 0.5);
        }

        .ticker-track {
            display: flex;
            white-space: nowrap;
            animation: marqueeScroll 28s linear infinite;
            padding-left: 30px;
        }

        .ticker-item {
            font-size: 1.05rem;
            font-weight: 700;
            color: #f3efff;
            margin-right: 60px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .ticker-sep {
            color: var(--accent-primary);
            font-size: 1.2rem;
        }

        @keyframes marqueeScroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* =========================================
           TAKEOVER DE LLEGADA / ANUNCIO FLASH
           ========================================= */
        .flash-overlay {
            position: fixed;
            inset: 0;
            background: rgba(7, 3, 22, 0.86);
            backdrop-filter: blur(8px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .flash-overlay.active {
            opacity: 1;
        }

        .flash-box {
            background: linear-gradient(135deg, #ff006e 0%, #8338ec 100%);
            border: 6px solid #ffffff;
            border-radius: 30px;
            padding: 45px 60px;
            max-width: 820px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 0 rgba(0, 0, 0, 0.75), 0 0 80px rgba(255, 0, 110, 0.6);
            transform: scale(0.5) rotate(-5deg);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .flash-overlay.active .flash-box {
            transform: scale(1) rotate(-1deg);
        }

        .flash-emoji {
            font-size: 4.5rem;
            margin-bottom: 10px;
            display: block;
            animation: bounceIcon 0.7s infinite alternate ease-in-out;
        }

        @keyframes bounceIcon {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-12px) scale(1.12); }
        }

        .flash-title {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(2.2rem, 5vw, 4rem);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            text-shadow: 0 6px 0 rgba(0, 0, 0, 0.5);
        }

        .flash-subtitle {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: 700;
            margin: 0;
            color: #fff3b0;
        }
    </style>
</head>
<body>

    <div class="bg-rays"></div>
    <div class="bg-dots"></div>
    <div id="floating-shapes" class="floating-shapes"></div>
    <canvas id="confetti-canvas"></canvas>

    <!-- Alerta gigante automática para llegadas o anuncios del JSON -->
    <div id="flash-overlay" class="flash-overlay">
        <div id="flash-box" class="flash-box">
            <span id="flash-emoji" class="flash-emoji">🎉</span>
            <h2 id="flash-title" class="flash-title">¡NUEVO INVITADO!</h2>
            <p id="flash-subtitle" class="flash-subtitle">Acaba de entrar a la sala</p>
        </div>
    </div>

    <div id="stage-wrapper" class="stage-wrapper">
        <!-- Header del Evento -->
        <header class="top-header">
            <div class="location-pill">
                <span class="live-dot"></span>
                <span id="event-location">SALA PRINCIPAL</span>
            </div>

            <div class="event-brand">
                <h1 id="event-title" class="event-title">PARTY LOBBY</h1>
                <span id="event-subtitle" class="event-subtitle">EN VIVO</span>
            </div>

            <div id="clock-pill" class="clock-pill">00:00</div>
        </header>

        <!-- Escenario Principal de Actividad -->
        <section id="activity-stage" class="activity-stage">
            <div id="activity-badge" class="activity-badge">EN CURSO</div>
            <h2 id="activity-title" class="activity-title">CARGANDO LOBBY...</h2>
            <p id="activity-desc" class="activity-desc">Sincronizando datos con fiesta.json</p>
        </section>

        <!-- Muro de Invitados -->
        <section>
            <div class="guests-header">
                <h3 class="guests-heading">🎟️ INVITADOS</h3>
                <div class="counters-bar">
                    <span id="count-present" class="counter-chip present">EN SALA: 0</span>
                    <span id="count-coming" class="counter-chip coming">EN CAMINO: 0</span>
                    <span id="count-missing" class="counter-chip missing">POR LLEGAR: 0</span>
                </div>
            </div>

            <div id="guests-grid" class="guests-grid" style="margin-top: 22px;"></div>
        </section>
    </div>

    <!-- Cintillo Inferior -->
    <footer class="ticker-bar">
        <div class="ticker-label">EN VIVO</div>
        <div id="ticker-track" class="ticker-track"></div>
    </footer>

    <script>
        const JSON_FILE = "fiesta.json";
        const POLL_INTERVAL_MS = 800; // Revisa cambios cada 0.8 segundos

        // Estado de respaldo por si abres el HTML localmente sin servidor HTTP
        const FALLBACK_DATA = {
            evento: {
                titulo: "NOCHE DE REUNIÓN & JUEGOS",
                subtitulo: "EDICIÓN ESPECIAL",
                ubicacion: "SALA PRINCIPAL",
                mostrarReloj: true
            },
            actividad: {
                estado: "EN CURSO",
                titulo: "BIENVENIDA AL LOBBY",
                descripcion: "Edita fiesta.json para cambiar el título, los invitados o lanzar alertas en vivo.",
                acentoColor: "#ffbe0b"
            },
            anuncioFlash: {
                id: "inicio",
                activo: false,
                emoji: "🔥",
                titulo: "¡ARRANCAMOS!",
                subtitulo: "Todos listos en la sala"
            },
            invitados: [
                { nombre: "Anfitrión", apodo: "HOST", estado: "presente", avatar: "👑", color: "#00f5d4" },
                { nombre: "Invitado 2", apodo: "VIP", estado: "en_camino", avatar: "🚀", color: "#ffbe0b" },
                { nombre: "Invitado 3", apodo: "JUGADOR", estado: "pendiente", avatar: "🎮", color: "#ff006e" }
            ],
            cintillo: [
                "🎉 Bienvenidos a la reunión",
                "⚡ Pantalla sincronizada en tiempo real con fiesta.json"
            ]
        };

        let lastRawJson = "";
        let previousState = null;
        let lastFlashId = null;
        let flashTimeout = null;

        // =========================================
        // 1. PARTÍCULAS FLOTANTES DEL FONDO
        // =========================================
        function initFloatingShapes() {
            const container = document.getElementById("floating-shapes");
            const icons = ["★", "▲", "●", "◆", "⚡", "🎮", "✦"];
            const colors = ["#ffbe0b", "#ff006e", "#00f5d4", "#8338ec", "#38b000"];

            for (let i = 0; i < 22; i++) {
                const el = document.createElement("span");
                el.className = "shape";
                el.textContent = icons[i % icons.length];
                el.style.left = `${Math.random() * 100}%`;
                el.style.color = colors[i % colors.length];
                el.style.fontSize = `${1.2 + Math.random() * 2}rem`;
                el.style.animationDuration = `${12 + Math.random() * 18}s`;
                el.style.animationDelay = `${-Math.random() * 20}s`;
                container.appendChild(el);
            }
        }

        // =========================================
        // 2. RELOJ EN VIVO
        // =========================================
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const mins = String(now.getMinutes()).padStart(2, "0");
            document.getElementById("clock-pill").textContent = `${hours}:${mins}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // =========================================
        // 3. SINTETIZADOR DE EFECTOS DE SONIDO (WEB AUDIO)
        // =========================================
        let audioCtx = null;
        function playChime(type = "arrive") {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === "suspended") audioCtx.resume();

                const notes = type === "activity"
                    ? [523.25, 659.25, 783.99, 1046.5] // Do-Mi-Sol-Do agudo
                    : [440, 554.37, 659.25];           // La-Do#-Mi alegre

                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.09);

                    gain.gain.setValueAtTime(0.14, audioCtx.currentTime + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.09 + 0.45);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.09);
                    osc.stop(audioCtx.currentTime + idx * 0.09 + 0.46);
                });
            } catch (e) {
                // Ignorar si el navegador bloquea audio sin interacción previa
            }
        }
        window.addEventListener("pointerdown", () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
        }, { once: true });

        // =========================================
        // 4. MOTOR DE CONFETI EN CANVAS
        // =========================================
        const confettiCanvas = document.getElementById("confetti-canvas");
        const ctx = confettiCanvas.getContext("2d");
        let confettiPieces = [];

        function resizeCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        function launchConfetti(amount = 90) {
            const palette = ["#ffbe0b", "#ff006e", "#00f5d4", "#8338ec", "#38b000", "#ffffff"];
            for (let i = 0; i < amount; i++) {
                confettiPieces.push({
                    x: confettiCanvas.width * (0.2 + Math.random() * 0.6),
                    y: confettiCanvas.height * 0.45,
                    vx: (Math.random() - 0.5) * 22,
                    vy: -8 - Math.random() * 14,
                    size: 8 + Math.random() * 8,
                    color: palette[Math.floor(Math.random() * palette.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 14
                });
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettiPieces.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.45; // Gravedad
                p.vx *= 0.98;
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                ctx.restore();

                if (p.y > confettiCanvas.height + 40) {
                    confettiPieces.splice(index, 1);
                }
            });
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

        // =========================================
        // 5. ALERTA GIGANTE (TAKEOVER)
        // =========================================
        function triggerFlashBanner(emoji, title, subtitle, duration = 4200) {
            const overlay = document.getElementById("flash-overlay");
            const stage = document.getElementById("stage-wrapper");

            document.getElementById("flash-emoji").textContent = emoji || "🎉";
            document.getElementById("flash-title").textContent = title;
            document.getElementById("flash-subtitle").textContent = subtitle;

            overlay.classList.add("active");
            stage.classList.remove("shake-active");
            void stage.offsetWidth;
            stage.classList.add("shake-active");

            launchConfetti(110);

            clearTimeout(flashTimeout);
            flashTimeout = setTimeout(() => {
                overlay.classList.remove("active");
            }, duration);
        }

        // =========================================
        // 6. RENDERIZADO INTELIGENTE DESDE EL JSON
        // =========================================
        function applyState(data) {
            // A) Evento / Header
            const ev = data.evento || {};
            document.getElementById("event-title").textContent = ev.titulo || "PARTY LOBBY";
            const subEl = document.getElementById("event-subtitle");
            if (ev.subtitulo) {
                subEl.textContent = ev.subtitulo;
                subEl.style.display = "inline-block";
            } else {
                subEl.style.display = "none";
            }
            document.getElementById("event-location").textContent = ev.ubicacion || "EN VIVO";
            document.getElementById("clock-pill").style.display = ev.mostrarReloj === false ? "none" : "block";

            // B) Actividad Central
            const act = data.actividad || {};
            const stageEl = document.getElementById("activity-stage");
            const badgeEl = document.getElementById("activity-badge");
            const titleEl = document.getElementById("activity-title");
            const descEl = document.getElementById("activity-desc");

            const accent = act.acentoColor || "#ffbe0b";
            stageEl.style.borderColor = accent;
            stageEl.style.boxShadow = `0 12px 0 rgba(0, 0, 0, 0.65), 0 0 50px ${accent}33`;
            badgeEl.style.backgroundColor = accent;

            const titleChanged = previousState && previousState.actividad?.titulo !== act.titulo;
            badgeEl.textContent = act.estado || "EN CURSO";
            titleEl.textContent = act.titulo || "ESPERANDO ACTIVIDAD";
            descEl.textContent = act.descripcion || "";

            if (titleChanged) {
                stageEl.classList.remove("slam-anim");
                void stageEl.offsetWidth;
                stageEl.classList.add("slam-anim");
                launchConfetti(85);
                playChime("activity");
            }

            // C) Anuncio Flash manual desde JSON
            const flash = data.anuncioFlash;
            if (flash && flash.activo && flash.id && flash.id !== lastFlashId) {
                lastFlashId = flash.id;
                playChime("activity");
                triggerFlashBanner(flash.emoji || "📢", flash.titulo || "¡ATENCIÓN!", flash.subtitulo || "", 5000);
            } else if (flash && !flash.activo) {
                lastFlashId = flash.id || null;
            }

            // D) Invitados
            const guests = Array.isArray(data.invitados) ? data.invitados : [];
            const prevMap = new Map();
            if (previousState && Array.isArray(previousState.invitados)) {
                previousState.invitados.forEach(g => prevMap.set(g.nombre, g.estado));
            }

            // Ordenar: Presentes primero, luego en camino, luego pendientes
            const orderWeight = { presente: 1, en_camino: 2, pendiente: 3, ausente: 3 };
            const sortedGuests = [...guests].sort((a, b) => {
                return (orderWeight[a.estado] || 9) - (orderWeight[b.estado] || 9);
            });

            let presentCount = 0;
            let comingCount = 0;
            let missingCount = 0;
            let newlyArrivedGuest = null;

            const grid = document.getElementById("guests-grid");
            grid.innerHTML = "";

            sortedGuests.forEach((guest, index) => {
                const status = (guest.estado || "pendiente").toLowerCase();
                if (status === "presente") presentCount++;
                else if (status === "en_camino") comingCount++;
                else missingCount++;

                const prevStatus = prevMap.get(guest.nombre);
                const justArrived = previousState && status === "presente" && prevStatus !== "presente";
                if (justArrived) {
                    newlyArrivedGuest = guest;
                }

                const statusLabel = status === "presente"
                    ? "EN LA SALA"
                    : status === "en_camino"
                        ? "EN CAMINO"
                        : "POR LLEGAR";

                const card = document.createElement("article");
                card.className = `guest-card status-${status}${justArrived ? " just-arrived" : ""}`;
                card.style.setProperty("--guest-color", guest.color || "#00f5d4");
                card.style.setProperty("--float-delay", `${(index * 0.25) % 2}s`);

                const isImageAvatar = typeof guest.avatar === "string" && (guest.avatar.startsWith("http") || guest.avatar.startsWith("/"));
                const avatarHtml = isImageAvatar
                    ? `<img src="${guest.avatar}" alt="${guest.nombre}">`
                    : (guest.avatar || "😎");

                card.innerHTML = `
                    <span class="guest-status-pill">${statusLabel}</span>
                    <div class="guest-avatar">${avatarHtml}</div>
                    <h4 class="guest-name">${guest.nombre || "Invitado"}</h4>
                    <span class="guest-role">${guest.apodo || "JUGADOR"}</span>
                `;

                grid.appendChild(card);
            });

            document.getElementById("count-present").textContent = `EN SALA: ${presentCount}`;
            document.getElementById("count-coming").textContent = `EN CAMINO: ${comingCount}`;
            document.getElementById("count-missing").textContent = `POR LLEGAR: ${missingCount}`;

            if (newlyArrivedGuest) {
                playChime("arrive");
                triggerFlashBanner(
                    newlyArrivedGuest.avatar && !newlyArrivedGuest.avatar.startsWith("http") ? newlyArrivedGuest.avatar : "🎉",
                    `¡${newlyArrivedGuest.nombre} LLEGÓ!`,
                    newlyArrivedGuest.apodo ? `${newlyArrivedGuest.apodo} se unió a la fiesta` : "Ya está en la sala",
                    3800
                );
            }

            const tickerList = Array.isArray(data.cintillo) && data.cintillo.length > 0
                ? data.cintillo
                : ["🎉 ¡Bienvenidos!"];
            const prevTicker = previousState ? JSON.stringify(previousState.cintillo) : "";
            const currTicker = JSON.stringify(tickerList);

            if (prevTicker !== currTicker) {
                const track = document.getElementById("ticker-track");
                const itemsHtml = tickerList.map(msg => `
                    <span class="ticker-item">${msg} <span class="ticker-sep">✦</span></span>
                `).join("");
                track.innerHTML = itemsHtml + itemsHtml;
            }

            previousState = JSON.parse(JSON.stringify(data));
        }

        async function pollJson() {
            try {
                const response = await fetch(`${JSON_FILE}?t=${Date.now()}`, { cache: "no-store" });
                if (!response.ok) throw new Error("No se pudo leer el JSON");
                const text = await response.text();

                if (text !== lastRawJson) {
                    const parsed = JSON.parse(text);
                    lastRawJson = text;
                    applyState(parsed);
                }
            } catch (err) {
                if (!previousState) {
                    applyState(FALLBACK_DATA);
                }
            }
        }

        initFloatingShapes();
        pollJson();
        setInterval(pollJson, POLL_INTERVAL_MS);
    </script>
</body>
